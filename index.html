<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Conway Music</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <canvas id="grid"></canvas>

  <div id="intro" class="overlay">
    <div class="overlay-card">
      <h1>Conway Music</h1>
      <p>
        Every cell holds a sound. Click cells to paint a starting pattern,
        then press <strong>Play</strong> — the grid evolves by the rules of
        Conway's Game of Life, one generation per beat, and every living
        cell plays its sound for as long as it survives.
      </p>
      <button id="intro-dismiss">Start composing</button>
    </div>
  </div>

  <div id="toppanel">
    <span class="panel-label">Grids</span>
    <button id="grids1" title="One grid: quarter notes (1)">1</button>
    <button id="grids2" title="Two grids: adds a dotted-quarter layer (2)">2</button>
    <button id="grids3" title="Three grids: adds a dotted-eighth layer (3)">3</button>
    <span class="panel-divider"></span>
    <span class="panel-label">Leads</span>
    <button id="lead1" title="Lead 1: a sustained solo voice that follows the board (L)">1</button>
    <button id="lead2" title="Lead 2: a lower voice that harmonizes with lead 1 (shift+L)">2</button>
  </div>

  <div id="controls">
    <button id="play" class="primary" title="Play / pause (Space)">&#9654; Play</button>
    <select id="presets" title="Load a classic pattern as a riff">
      <option value="">Riffs&hellip;</option>
    </select>
    <select id="mode" title="Sound mode: how sounds are assigned to cells"></select>
    <select id="family" title="Voice family: the instrument palette cells draw from"></select>
    <button id="step" title="Advance one generation (S)">Step</button>
    <button id="random" title="Random pattern (R)">Random</button>
    <button id="clear" title="Clear the grid (C)">Clear</button>
    <button id="share" title="Copy a link to this pattern">Share</button>
    <label class="bpm-control">
      BPM <input id="bpm" type="range" min="40" max="240" step="1" />
      <span id="bpm-value"></span>
    </label>
    <span id="generation" title="Generation">gen 0</span>
    <span id="soundbank" title="Where the sounds came from"></span>
    <button id="collapse" title="Hide controls">&#9662;</button>
  </div>

  <script src="config.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
